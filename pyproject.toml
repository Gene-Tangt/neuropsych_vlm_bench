[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropsych-vlm-bench"
version = "1.0.0"
description = "Neuropsychological tests of visual perception for vision-language models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
    "openai>=1.45.0",
    "anthropic>=1,<2",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.62.0",
    "gdown>=5.2.0",
]

[tool.setuptools]
packages = ["neuropsych_bench"]

[tool.setuptools.package-data]
neuropsych_bench = ["data/*"]
